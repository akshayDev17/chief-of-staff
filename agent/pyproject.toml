[project]
name = "chief-of-staff-agent"
version = "0.1.0"
description = "The chief-of-staff agent: one container served by ADK's HTTP server."
requires-python = "==3.13.*"
dependencies = [
    "google-adk==2.15.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chief_of_staff_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
