name: Release Bedrock template

# The Bedrock role template's own release unit (T16, design-v3 1.4,
# ADR-017; shell/bedrock-template/README.md): on main, publish each version
# of shell/bedrock-template/template.json to the address the "Connect Amazon
# Bedrock" quick-create link opens. A published version is never changed:
# users' stacks keep the version they were made with. Rollback is pointing
# the Worker variable BEDROCK_TEMPLATE_URL back at the previous version.
#
# Until T10 provides the owner's AWS values it stops after the checks with a
# plain message and touches no AWS account.
#
# Variables (T10, not secret): BEDROCK_TEMPLATE_BUCKET (a bucket the public
# can read) and BEDROCK_PUBLISH_ROLE_ARN (a role in the owner's account that
# trusts this repository's GitHub OIDC tokens and may only put objects under
# chief-of-staff-bedrock-role/ in that bucket). No AWS key is stored.

on:
  push:
    branches: [main]
    paths:
      - 'shell/bedrock-template/**'
      - '.github/workflows/release-bedrock-template.yml'

permissions:
  contents: read

concurrency:
  group: release-bedrock-template
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the GitHub OIDC token AWS trusts; no AWS key
    defaults:
      run:
        working-directory: shell/bedrock-template
    env:
      BUCKET: ${{ vars.BEDROCK_TEMPLATE_BUCKET }}
      PUBLISH_ROLE_ARN: ${{ vars.BEDROCK_PUBLISH_ROLE_ARN }}
      AWS_REGION: us-east-1 # the template bucket's region
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the template and read its version
        id: version
        run: |
          version="$(node -e '
            const t = require("./template.json");
            const v = t.Metadata.TemplateVersion;
            if (!/^\d+\.\d+\.\d+$/.test(v)) throw new Error("Metadata.TemplateVersion must be x.y.z");
            if (t.Outputs.TemplateVersion.Value !== v) throw new Error("the TemplateVersion output must equal Metadata.TemplateVersion");
            console.log(v);
          ')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "key=chief-of-staff-bedrock-role/v${version}.json" >> "$GITHUB_OUTPUT"

      - name: Skip while the owner's AWS values are not set
        id: gate
        run: |
          if [ -z "$BUCKET" ] || [ -z "$PUBLISH_ROLE_ARN" ]; then
            echo "Publish skipped: BEDROCK_TEMPLATE_BUCKET and BEDROCK_PUBLISH_ROLE_ARN are not set (they arrive with T10). Nothing was published."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      # GitHub's OIDC token, traded for the publish role's one-hour credentials.
      - name: Take the publish role
        if: steps.gate.outputs.go == 'true'
        run: |
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).value))')"
          creds="$(aws sts assume-role-with-web-identity --role-arn "$PUBLISH_ROLE_ARN" \
            --role-session-name "bedrock-template-${GITHUB_RUN_ID}" --web-identity-token "$token" \
            --duration-seconds 900 --query Credentials --output json)"
          {
            echo "AWS_ACCESS_KEY_ID=$(node -p 'JSON.parse(process.argv[1]).AccessKeyId' "$creds")"
            echo "AWS_SECRET_ACCESS_KEY=$(node -p 'JSON.parse(process.argv[1]).SecretAccessKey' "$creds")"
            echo "AWS_SESSION_TOKEN=$(node -p 'JSON.parse(process.argv[1]).SessionToken' "$creds")"
          } >> "$GITHUB_ENV"

      - name: Publish the version, never over a published one
        if: steps.gate.outputs.go == 'true'
        env:
          KEY: ${{ steps.version.outputs.key }}
        run: |
          if aws s3api head-object --bucket "$BUCKET" --key "$KEY" >/dev/null 2>&1; then
            aws s3 cp "s3://${BUCKET}/${KEY}" published.json --only-show-errors
            if cmp -s published.json template.json; then
              echo "v${{ steps.version.outputs.version }} is already published unchanged."
              exit 0
            fi
            echo "::error::v${{ steps.version.outputs.version }} is already published with different content; raise TemplateVersion instead."
            exit 1
          fi
          aws cloudformation validate-template --template-body file://template.json >/dev/null
          aws s3 cp template.json "s3://${BUCKET}/${KEY}" --content-type application/json --only-show-errors
          url="https://${BUCKET}.s3.amazonaws.com/${KEY}"
          echo "Published ${url}"
          echo "Published \`${url}\`. Set it as the environment variable BEDROCK_TEMPLATE_URL of the GitHub environment \`production\`; the next shell release deploys it." >> "$GITHUB_STEP_SUMMARY"
